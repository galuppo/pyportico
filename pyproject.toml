[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "portico-espacial"
version = "0.1.0"
description = "Modelo de dados para pórticos espaciais de concreto armado, independente de software de análise, com exportação DXF e IFC4."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "galuppo" }]
keywords = ["engenharia estrutural", "concreto armado", "pórtico espacial", "NBR 6118", "IFC", "DXF"]
classifiers = [
	"Development Status :: 3 - Alpha",
	"Intended Audience :: Science/Research",
	"Natural Language :: Portuguese (Brazilian)",
	"Operating System :: OS Independent",
	"Programming Language :: Python :: 3",
	"Programming Language :: Python :: 3 :: Only",
	"Programming Language :: Python :: 3.10",
	"Programming Language :: Python :: 3.11",
	"Programming Language :: Python :: 3.12",
	"Programming Language :: Python :: 3.13",
	"Topic :: Scientific/Engineering",
	"Typing :: Typed",
]
dependencies = [
	"numpy>=1.24",
]

[project.optional-dependencies]
dxf = ["ezdxf>=1.1"]
dev = [
	"ezdxf>=1.1",
	"pytest>=8",
	"ruff==0.17.*",
]

[project.urls]
# CONFIRMAR: substituir pelo endereço real do repositório
Homepage = "https://github.com/<usuario>/<repositorio>"
Issues = "https://github.com/<usuario>/<repositorio>/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/portico_espacial"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.format]
indent-style = "tab"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# W191: indentação com TAB é a convenção do projeto
# E101: TAB + espaços só ocorre em alinhamento dentro de docstrings (listas, desenhos ASCII)
ignore = ["W191", "E101", "E501"]

[tool.ruff.lint.per-file-ignores]
# variáveis nomeadas documentam os elementos lançados, mesmo sem uso posterior
"examples/*" = ["F841"]
